<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
    
    .title {
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 38px;
      fill: #ffffff;
    }
    
    .subtitle {
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 18px;
      fill: #888888;
    }
    
    .cursor {
      fill: #ffffff;
      transform: translateX(0px);
      animation: 
        moveCursor 2.5s steps(41, end) forwards,
        blink 0.8s step-end infinite;
      animation-delay: 0.5s, 3.0s;
    }
    
    #clip-rect {
      animation: typeText 2.5s steps(41, end) forwards;
      animation-delay: 0.5s;
    }
    
    @keyframes typeText {
      from { width: 0; }
      to { width: 450px; }
    }
    
    @keyframes moveCursor {
      from { transform: translateX(0px); }
      to { transform: translateX(445px); }
    }
    
    @keyframes blink {
      from, to { opacity: 0; }
      50% { opacity: 1; }
    }
    ]]>
  </style>
  
  <clipPath id="clip">
    <rect id="clip-rect" x="10" y="70" width="0" height="30" />
  </clipPath>
  
  <rect width="100%" height="100%" fill="none" />
  
  <text x="10" y="50" class="title">> RUTHVIK KARNE</text>
  
  <g clip-path="url(#clip)">
    <text x="10" y="90" class="subtitle">Full-Stack Developer Intern @ Validly Ltd</text>
  </g>
  
  <rect x="10" y="74" width="8" height="18" class="cursor" />
</svg>
