<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <style>
    .title {
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-weight: 700;
      font-size: 38px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 18px;
      fill: #888888;
    }
    .cursor {
      fill: #ffffff;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      from, to { opacity: 0 }
      50% { opacity: 1 }
    }
  </style>
  <clipPath id="clip">
    <rect x="10" y="70" width="0" height="30">
      <animate attributeName="width" from="0" to="460" dur="2.5s" fill="freeze" begin="0.5s" />
    </rect>
  </clipPath>
  <rect width="100%" height="100%" fill="none" />
  <text x="10" y="50" class="title">> RUTHVIK KARNE</text>
  <g clip-path="url(#clip)">
    <text x="10" y="90" class="subtitle">Full-Stack Developer Intern @ Validly Ltd</text>
  </g>
  <rect x="455" y="74" width="8" height="18" class="cursor">
    <animate attributeName="x" from="10" to="455" dur="2.5s" fill="freeze" begin="0.5s" />
  </rect>
</svg>
